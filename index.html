<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <meta name="theme-color" content="#0b0221">
  <style>
    body { margin: 0; min-height: 100vh; background: #0b0221; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 48px 16px; box-sizing: border-box; }
    h1 { font-size: 40px; margin: 0 0 28px; letter-spacing: 2px; }
    a.card { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 420px; padding: 16px;
      border: 2px solid #05d9e8; border-radius: 16px; color: #fff; text-decoration: none;
      background: rgba(255,255,255,.04); }
    a.card img { width: 64px; height: 64px; border-radius: 14px; }
    a.card strong { display: block; font-size: 20px; }
    a.card span { opacity: .7; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Games</h1>
  <a class="card" href="runner/">
    <img src="runner/icons/icon-192.png" alt="">
    <div><strong>Neon Dash</strong><span>Endless runner: steer, jump, dodge</span></div>
  </a>
</body>
</html>
